---
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15

  # Dependabot's github-actions ecosystem only scans .github/workflows/*.yml;
  # actions referenced inside locally-defined composite actions (action.yml)
  # need their own directory entry or they're silently never bumped.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/cache"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
