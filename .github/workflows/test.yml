---
name: Run Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      # Restore cached virtual environment
      - name: Restore virtual environment
        id: restore-cache
        uses: ./.github/actions/cache

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Restore virtual environment
        id: restore-cache
        uses: ./.github/actions/cache

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python3 -m ruff check .

      - name: Format
        run: python3 -m ruff format . --check

      - name: Markdown lint
        run: python3 -m pymarkdown scan **/*.md

      - name: Type check
        run: python3 -m mypy custom_components/ tests/

  tests:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      # Required for PR comments
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Restore virtual environment
        id: restore-cache
        uses: ./.github/actions/cache

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --junitxml=pytest.xml --cov=./custom_components/ --cov-config=.coveragerc --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ANNOTATE_MISSING_LINES: "true"

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v7.0.1
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
          include-hidden-files: true

  tests-min-ha:
    # Verifies the tests still pass against the minimum Home Assistant
    # version declared in hacs.json, since dependabot only ever bumps
    # pytest-homeassistant-custom-component toward the newest release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"

      - name: Restore virtual environment
        id: restore-cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.local
            ~/.cache
            ${{ env.pythonLocation }}
          key: ${{ runner.os }}-venv-min-ha-${{ hashFiles('.github/requirements-min-ha.txt') }}

      - name: Install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-min-ha.txt

      - name: Run tests
        run: pytest
