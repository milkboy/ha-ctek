---
name: "Shared cache"
outputs:
  cache-hit:
    description: "Whether the cache was restored"
    value: ${{ steps.python-cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - name: Restore virtual environment
      id: python-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local
          ~/.cache
          ${{ env.pythonLocation }}
        key: ${{ runner.os }}-venv-${{ hashFiles('**/requirements.txt') }}
